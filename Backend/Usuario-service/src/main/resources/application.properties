server.port=8081
spring.application.name=Usuario-service

# ==========================================
# 1. Conexión a MySQL
# ==========================================
# El parámetro ?createDatabaseIfNotExist=true creará la BD si aún no existe
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. Configuración de Liquibase
# ==========================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.usuarios.sql

# ==========================================
# 3. Importante para Hibernate / JPA
# ==========================================
# Ponlo en 'none' o 'validate' para que Hibernate NO intente crear 
# tablas por su cuenta y deje que Liquibase tenga el control total
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true